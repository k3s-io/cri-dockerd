name: Build

on:
  workflow_call:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

    - name: Load environment
      uses: c-py/action-dotenv-to-setenv@80f488cda311f44d43e687a4e94f54a050b7822a # v4
      with:
        env-file: .github/.env

    - name: Set up Go ${{ env.GO_VERSION }}
      uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Build
      run: make static-linux

    - name: Upload
      if: ${{ github.event_name == 'release' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: cri-dockerd.ubuntu
        retention-days: 5
        path: |
          packaging/static/**/**/**/*.tgz

  deb:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

    - name: Load environment
      uses: c-py/action-dotenv-to-setenv@80f488cda311f44d43e687a4e94f54a050b7822a # v4
      with:
        env-file: .github/.env

    - name: Set up Go ${{ env.GO_VERSION }}
      uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Build
      run: make deb

    - name: Upload
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: cri-dockerd.deb
        retention-days: 5
        path: |
          packaging/deb/**/**/**/*.deb

  rpm:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

    - name: Load environment
      uses: c-py/action-dotenv-to-setenv@80f488cda311f44d43e687a4e94f54a050b7822a # v4
      with:
        env-file: .github/.env

    - name: Set up Go ${{ env.GO_VERSION }}
      uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Build
      run: make rpm

    - name: Upload
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: cri-dockerd.rpm
        retention-days: 5
        path: |
          packaging/rpm/**/**/**/*.rpm

  arm:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

    - name: Load environment
      uses: c-py/action-dotenv-to-setenv@80f488cda311f44d43e687a4e94f54a050b7822a # v4
      with:
        env-file: .github/.env

    - name: Set up Go ${{ env.GO_VERSION }}
      uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Build
      run: make cross-arm

    - name: Upload
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: cri-dockerd.arm
        retention-days: 5
        path: |
          packaging/static/**/**/**/*.tgz

  windows:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

    - name: Load environment
      uses: c-py/action-dotenv-to-setenv@80f488cda311f44d43e687a4e94f54a050b7822a # v4
      with:
        env-file: .github/.env

    - name: Set up Go ${{ env.GO_VERSION }}
      uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Build
      run: make cross-win

    - name: Upload
      if: ${{ github.event_name == 'release' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: cri-dockerd.win
        retention-days: 5
        path: |
          packaging/static/**/**/**/*.zip

  mac:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

    - name: Load environment
      uses: c-py/action-dotenv-to-setenv@80f488cda311f44d43e687a4e94f54a050b7822a # v4
      with:
        env-file: .github/.env

    - name: Set up Go ${{ env.GO_VERSION }}
      uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Build
      run: make cross-mac

    - name: Upload
      if: ${{ github.event_name == 'release' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: cri-dockerd.darwin
        retention-days: 5
        path: |
          packaging/static/**/**/**/*.tgz
